[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuntur-data"
version = "1.0.0"
description = "Auditable Earth observation catalog and guarded acquisition tools for KUNTUR"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
phase2 = [
  "joblib>=1.3",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "psutil>=5.9",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "torch>=2.2",
]
external = [
  "pdfplumber>=0.11",
  "psutil>=5.9",
  "rasterio>=1.3",
  "requests>=2.31",
]
test = [
  "pdfplumber>=0.11",
  "pytest>=8",
  "PyYAML>=6",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
